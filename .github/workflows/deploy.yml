name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site lives under /<repo>; keep SEO URLs absolute to the Pages host.
      NEXT_PUBLIC_BASE_PATH: /vithaya-portfolio
      NEXT_PUBLIC_SITE_URL: https://teang459.github.io/vithaya-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not ci): the lockfile is generated on Windows, but some
      # deps resolve platform-specific optional packages (@emnapi/*) differently
      # on the Linux runner, which trips npm ci's strict sync check.
      - run: npm install
      - run: npm run build
      # Serve the underscore-prefixed _next folder as-is (skip Jekyll).
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
